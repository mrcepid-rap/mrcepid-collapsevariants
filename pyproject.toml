[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrcepid-collapsevariants"
version = "2.3.0"
description = "Generates dummy input files for various association testing software"
readme = "Readme.md"
authors = [
    { name = "Eugene Gardner", email = "eugene.gardner@insmed.com" },
    { name = "Alish Palmos", email = "alish.palmos@insmed.com" }
]

requires-python = "~=3.8.10"
dependencies = [
    "bgen==1.9.0",
    "dxpy==0.346.0",
    "general-utilities @ git+https://github.com/mrcepid-rap/general_utilities.git@v2.0.0",
    "numpy==1.23.2",
    "pandas==1.5.2",
    "pytest==7.4.4",
    "pytest-cov~=5.0",
    "scipy==1.10.1",
]

[tool.coverage.run]
omit = [
    "test/*", # Exclude all test files
    "tests/*", # If your tests folder is named "tests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collapsevariants*"]