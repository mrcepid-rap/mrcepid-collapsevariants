name: Sync version on tag (main only)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  sync-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure tag commit is on main
        id: guard
        run: |
          git fetch origin main
          if git merge-base --is-ancestor $GITHUB_SHA origin/main; then
            echo "on_main=true" >> $GITHUB_OUTPUT
          else
            echo "Tag is not on main; skipping."
            echo "on_main=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not on main
        if: steps.guard.outputs.on_main != 'true'
        run: exit 0

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Update version strings
        run: |
          # Update pyproject.toml (within [project] section)
          sed -i '/^\[project\]/,/^\[/{s/^version = .*/version = "'"$VERSION"'"/}' pyproject.toml

          # Update dxapp.json (version + tag fields)
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" dxapp.json
          sed -i "s/\"tag\": \"v.*\"/\"tag\": \"v$VERSION\"/" dxapp.json

      - name: Show version changes
        run: git diff --color

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml dxapp.json || true
          git commit -m "chore: sync version to $VERSION" || echo "No changes to commit"
          git fetch origin main:main
          git push origin main
